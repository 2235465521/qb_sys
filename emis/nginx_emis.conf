# EMIS Windows 生产环境 Nginx 配置参考 (nginx_emis.conf)

server {
    listen 80;
    server_name localhost; # 请根据实际部署域名或 IP 进行修改

    # 1. 前端静态资源
    location / {
        root "E:/企标记录/emis/frontend/dist"; # 前端打包后的 dist 目录
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 后端 API 代理
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. 安全性：严禁外部直接绕过权限下载打包的临时 ZIP 压缩包
    location /media/temp_zips/ {
        internal; # 标记为 internal，外部请求直接返回 404
    }

    # 4. 媒体文件访问 (Django 管理，例如企业 Logo 静态访问等)
    location /media/ {
        alias "E:/企标记录/emis/backend/media/";
    }

    # 5. 高性能安全下载 - 物理共享磁盘阵列 (X-Accel-Redirect)
    # 对应 Django 返回的 X-Accel-Redirect: /protected_shared_disk/...
    location /protected_shared_disk/ {
        internal; # 禁止外部直接访问
        alias "Y:/磁盘阵列/标准文件下载/企标下载/";
        
        # 针对大文件下载的优化
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 6. 高性能安全下载 - 本地 Media 目录 (X-Accel-Redirect)
    # 对应 Django 返回的 X-Accel-Redirect: /protected_media/...
    location /protected_media/ {
        internal; # 禁止外部直接访问
        alias "E:/企标记录/emis/backend/media/";
        
        # 针对大文件下载的优化
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 7. 客户端文件上传限制
    client_max_body_size 50M;
}
