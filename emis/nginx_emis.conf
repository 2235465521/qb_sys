# EMIS Linux 生产环境 Nginx 配置 (nginx_emis.conf)

server {
    listen 8088;
    server_name 47.106.104.48; # 您的服务器公网 IP

    # 1. 前端静态资源
    location / {
        root /home/zkbz01/emis_v2/xiangmu/emis/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. 后端 API 代理 (转发到 Gunicorn 8003)
    location /api/ {
        proxy_pass http://127.0.0.1:8003/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Django 原生后台页面 (/django-admin/)
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8003/django-admin/;
        proxy_set_header Host $http_host;
    }

    # 4. 后端静态文件与媒体文件 (Django admin 样式等)
    location /static/ {
        alias /home/zkbz01/emis_v2/xiangmu/emis/backend/staticfiles/;
    }

    location /media/ {
        alias /home/zkbz01/emis_v2/xiangmu/emis/backend/media/;
    }

    # 5. 安全性：严禁外部直接绕过权限下载打包的临时 ZIP 压缩包
    location /media/temp_zips/ {
        internal;
    }

    # 6. 高性能安全下载 - 物理共享磁盘阵列 (X-Accel-Redirect)
    location /protected_shared_disk/ {
        internal; # 禁止外部直接访问
        alias /mnt/std_bk/磁盘阵列/标准文件下载/企标下载/;
        
        # 针对大文件下载的优化
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 7. 高性能安全下载 - 本地 Media 目录 (X-Accel-Redirect)
    location /protected_media/ {
        internal;
        alias /home/zkbz01/emis_v2/xiangmu/emis/backend/media/;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
    }

    # 8. 客户端文件上传限制
    client_max_body_size 50M;
}
